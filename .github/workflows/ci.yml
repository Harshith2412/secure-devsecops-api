name: DevSecOps CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'

jobs:
  lint:
    name: Code Linting
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff
      
      - name: Run Ruff linter
        run: |
          ruff check app/ --output-format=github
      
      - name: Run Ruff formatter check
        run: |
          ruff format app/ --check

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: testdb
          MYSQL_USER: testuser
          MYSQL_PASSWORD: testpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      
      - name: Run unit tests
        env:
          SECRET_KEY: test-secret-key-for-ci-pipeline
          DATABASE_URL: sqlite:///./test.db
        run: |
          pytest tests/unit/ -v --cov=app --cov-report=xml --cov-report=term
      
      - name: Run integration tests
        env:
          SECRET_KEY: test-secret-key-for-ci-pipeline
          DATABASE_URL: sqlite:///./test.db
        run: |
          pytest tests/integration/ -v --cov=app --cov-append --cov-report=xml --cov-report=term
      
      - name: Run security tests
        env:
          SECRET_KEY: test-secret-key-for-ci-pipeline
          DATABASE_URL: sqlite:///./test.db
        run: |
          pytest tests/security/ -v --cov=app --cov-append --cov-report=xml --cov-report=term
      
      - name: Check code coverage threshold
        run: |
          pytest --cov=app --cov-fail-under=75 tests/
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
      
      - name: Generate coverage report
        run: |
          coverage report --show-missing
      
      - name: Upload coverage HTML report
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 7

  sast:
    name: Static Application Security Testing
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit[toml]
      
      - name: Run Bandit security scanner
        run: |
          bandit -r app/ -ll -f json -o bandit-report.json
        continue-on-error: true
      
      - name: Run Bandit with output
        run: |
          bandit -r app/ -ll
      
      - name: Upload Bandit results
        uses: actions/upload-artifact@v3
        with:
          name: bandit-report
          path: bandit-report.json
          retention-days: 30
      
      - name: Check for HIGH/CRITICAL issues
        run: |
          if [ -f bandit-report.json ]; then
            HIGH_ISSUES=$(jq '[.results[] | select(.issue_severity=="HIGH" or .issue_severity=="CRITICAL")] | length' bandit-report.json)
            if [ "$HIGH_ISSUES" -gt 0 ]; then
              echo "Found $HIGH_ISSUES HIGH or CRITICAL severity issues"
              exit 1
            fi
          fi

  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit
      
      - name: Run pip-audit
        run: |
          pip-audit --format json --output pip-audit-report.json
        continue-on-error: true
      
      - name: Run pip-audit with output
        run: |
          pip-audit
        continue-on-error: true
      
      - name: Upload pip-audit results
        uses: actions/upload-artifact@v3
        with:
          name: pip-audit-report
          path: pip-audit-report.json
          retention-days: 30
      
      - name: Check for critical vulnerabilities
        run: |
          if [ -f pip-audit-report.json ]; then
            # Check if there are any vulnerabilities
            VULN_COUNT=$(jq '.dependencies | length' pip-audit-report.json 2>/dev/null || echo "0")
            if [ "$VULN_COUNT" != "0" ]; then
              echo "Found $VULN_COUNT vulnerable dependencies"
              echo "Review pip-audit-report.json for details"
              # Don't fail on vulnerabilities in CI for now - just warn
              # exit 1
            fi
          fi

  secrets-scan:
    name: Secrets Detection
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
      
      - name: Upload Gitleaks report
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          retention-days: 30

  container-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: secure-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/secure-api.tar
      
      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v3
        with:
          name: docker-image
          path: /tmp/secure-api.tar
          retention-days: 1

  container-scan:
    name: Container Security Scan
    runs-on: ubuntu-latest
    needs: container-build
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download Docker image
        uses: actions/download-artifact@v3
        with:
          name: docker-image
          path: /tmp
      
      - name: Load Docker image
        run: |
          docker load --input /tmp/secure-api.tar
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'secure-api:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
      
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
      
      - name: Run Trivy with table output
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'secure-api:${{ github.sha }}'
          format: 'table'
          severity: 'CRITICAL,HIGH'
      
      - name: Upload Trivy report
        uses: actions/upload-artifact@v3
        with:
          name: trivy-report
          path: trivy-results.sarif
          retention-days: 30

  sbom-generation:
    name: Generate SBOM
    runs-on: ubuntu-latest
    needs: container-build
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download Docker image
        uses: actions/download-artifact@v3
        with:
          name: docker-image
          path: /tmp
      
      - name: Load Docker image
        run: |
          docker load --input /tmp/secure-api.tar
      
      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          image: 'secure-api:${{ github.sha }}'
          format: 'spdx-json'
          output-file: 'sbom.spdx.json'
      
      - name: Generate SBOM in CycloneDX format
        uses: anchore/sbom-action@v0
        with:
          image: 'secure-api:${{ github.sha }}'
          format: 'cyclonedx-json'
          output-file: 'sbom.cyclonedx.json'
      
      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v3
        with:
          name: sbom-reports
          path: |
            sbom.spdx.json
            sbom.cyclonedx.json
          retention-days: 90

  security-gate:
    name: Security Gate Summary
    runs-on: ubuntu-latest
    needs: [lint, test, sast, dependency-scan, secrets-scan, container-scan]
    if: always()
    
    steps:
      - name: Check job results
        run: |
          echo "Lint: ${{ needs.lint.result }}"
          echo "Test: ${{ needs.test.result }}"
          echo "SAST: ${{ needs.sast.result }}"
          echo "Dependency Scan: ${{ needs.dependency-scan.result }}"
          echo "Secrets Scan: ${{ needs.secrets-scan.result }}"
          echo "Container Scan: ${{ needs.container-scan.result }}"
      
      - name: Verify security gate
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]] || \
             [[ "${{ needs.test.result }}" != "success" ]] || \
             [[ "${{ needs.secrets-scan.result }}" != "success" ]]; then
            echo "❌ Security gate FAILED"
            echo "Critical checks (lint, test, secrets-scan) must pass"
            exit 1
          fi
          
          if [[ "${{ needs.sast.result }}" != "success" ]] || \
             [[ "${{ needs.container-scan.result }}" != "success" ]]; then
            echo "⚠️  Security gate PASSED with warnings"
            echo "Some security scans have findings - review artifacts"
            exit 0
          fi
          
          echo "✅ Security gate PASSED - All checks successful"

  security-report:
    name: Generate Security Report
    runs-on: ubuntu-latest
    needs: [sast, dependency-scan, container-scan]
    if: always()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v3
      
      - name: Generate security summary
        run: |
          echo "# Security Scan Summary" > security-summary.md
          echo "" >> security-summary.md
          echo "**Commit:** ${{ github.sha }}" >> security-summary.md
          echo "**Branch:** ${{ github.ref_name }}" >> security-summary.md
          echo "**Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> security-summary.md
          echo "" >> security-summary.md
          
          echo "## Scan Results" >> security-summary.md
          echo "" >> security-summary.md
          echo "| Scan Type | Status |" >> security-summary.md
          echo "|-----------|--------|" >> security-summary.md
          echo "| SAST (Bandit) | ${{ needs.sast.result }} |" >> security-summary.md
          echo "| Dependency Scan | ${{ needs.dependency-scan.result }} |" >> security-summary.md
          echo "| Container Scan (Trivy) | ${{ needs.container-scan.result }} |" >> security-summary.md
          echo "" >> security-summary.md
          
          if [ -f bandit-report/bandit-report.json ]; then
            BANDIT_ISSUES=$(jq '.results | length' bandit-report/bandit-report.json)
            echo "**Bandit Issues:** $BANDIT_ISSUES" >> security-summary.md
          fi
          
          echo "" >> security-summary.md
          echo "See individual artifact reports for details." >> security-summary.md
      
      - name: Upload security summary
        uses: actions/upload-artifact@v3
        with:
          name: security-summary
          path: security-summary.md
          retention-days: 90
      
      - name: Comment PR with security summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('security-summary.md', 'utf8');
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });